[pytest]
# 只收集 tests/ 下的用例
testpaths = tests
# 默认安静模式：只打点，出问题才展开
addopts = -q --tb=short
# tests/fixtures 里是自造的 HTML 样本，不是测试模块
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# requests 走 verify=False 时会刷一屏 InsecureRequestWarning，全部过滤掉
filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning
    ignore::requests.exceptions.RequestsDependencyWarning